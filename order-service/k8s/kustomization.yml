apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yml
  - service.yml

# Mounted at /workspace/config; environment overlays (e.g. production in
# bookshop-deployment) merge their own application-<profile>.yml into it.
configMapGenerator:
  - name: order-config
    files:
      - application.yml
    options:
      labels:
        app: order-service
