# Replaces the book's B.2 (DigitalOcean managed PostgreSQL) with an in-cluster
# PostgreSQL on the k3s server. Apps only see host/port/credentials via Secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookshop-postgres-init
data:
  # Runs only on first start (empty volume). Same database names the services
  # use in dev, docker-compose and catalog-service/k8s/application.yml.
  init.sql: |
    CREATE DATABASE "bookshop-catalog-db";
    CREATE DATABASE "bookshop-order-db";
---
apiVersion: v1
kind: Service
metadata:
  name: bookshop-postgres
  labels:
    app: bookshop-postgres
spec:
  type: ClusterIP
  selector:
    app: bookshop-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bookshop-postgres
spec:
  serviceName: bookshop-postgres
  replicas: 1
  selector:
    matchLabels:
      app: bookshop-postgres
  template:
    metadata:
      labels:
        app: bookshop-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18              # book uses 14; dev setup uses 18
          envFrom:
            - secretRef:
                name: bookshop-postgres-admin   # POSTGRES_USER / POSTGRES_PASSWORD
          # No PGDATA override: postgres 18+ defaults to /var/lib/postgresql/18/docker,
          # a version-specific subfolder of the volume mounted below.
          # Same Ubuntu AppArmor issue as ingress-nginx: the containerd profile
          # blocks signals inside the container, so gosu (root -> postgres user
          # switch) spins forever at 100% CPU and PostgreSQL never starts.
          securityContext:
            appArmorProfile:
              type: Unconfined
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            # postgres 18+ expects the volume at /var/lib/postgresql (not .../data);
            # it refuses to start if something is mounted at /var/lib/postgresql/data.
            - name: data
              mountPath: /var/lib/postgresql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: bookshop-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 5Gi
