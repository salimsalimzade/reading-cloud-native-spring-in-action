apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Book uses provider/do (DigitalOcean LB + proxy protocol). Our cluster is a
# single-node k3s on Ubuntu, where k3s ServiceLB exposes LoadBalancer services
# on the node IP, so we use the generic "cloud" manifest and no proxy protocol.
resources:
  - https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/cloud/deploy.yaml

patches:
  - path: patch-controller.yml
