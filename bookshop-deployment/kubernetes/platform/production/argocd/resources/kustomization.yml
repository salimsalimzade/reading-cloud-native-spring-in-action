apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - namespace.yml
  # Book pins v2.11.3 (end of life); v3 keeps the same Application/CLI flow.
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.1/manifests/install.yaml

patches:
  # Book only switches argocd-server to LoadBalancer. On single-node k3s every
  # LoadBalancer port is bound on the node IP, and ingress-nginx already owns
  # 80/443, so Argo CD is exposed on 8180 (http) and 8443 (https) instead.
  - target:
      kind: Service
      name: argocd-server
    patch: |-
      - op: replace
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 8180
      - op: replace
        path: /spec/ports/1/port
        value: 8443
