apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-service
spec:
  template:
    spec:
      containers:
        - name: edge-service
          volumeMounts:
            # (The book mounts Redis at .../secrets/postgres, a typo.)
            - name: redis-credentials-volume
              mountPath: /workspace/secrets/redis
            - name: keycloak-client-credentials-volume
              mountPath: /workspace/secrets/keycloak-client
            - name: keycloak-issuer-client-secret-volume
              mountPath: /workspace/secrets/keycloak-issuer
      # Merged with the base's ConfigMap volume (edge-config).
      volumes:
        - name: redis-credentials-volume
          secret:
            secretName: bookshop-redis-credentials
        - name: keycloak-client-credentials-volume
          secret:
            secretName: bookshop-keycloak-client-credentials
        - name: keycloak-issuer-client-secret-volume
          secret:
            secretName: keycloak-issuer-client-secret
