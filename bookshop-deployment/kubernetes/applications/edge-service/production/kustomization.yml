apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

  # Remote base: Edge Service manifests (edge-service/k8s) in this monorepo.
  # Starts at `main` like the book's 15-end; the production stage pins it to the
  # release commit (and sets the image tag) on the next Edge Service release.
  # Blocks /actuator from outside the cluster (replaces the book's patch-ingress.yml).
resources:
- github.com/salimsalimzade/reading-cloud-native-spring-in-action/edge-service/k8s?ref=8ef0d7dcfc76e2865d0edca25fcc32b7c6add869
- ingress-actuator.yml

# Book uses `patchesStrategicMerge`, which is deprecated in Kustomize v5.
# `patches` with a `path` is the replacement and still does a strategic merge.
patches:
- path: patch-env.yml
- path: patch-resources.yml
- path: patch-volumes.yml

# Adds application-prod.yml to the base's edge-config ConfigMap.
configMapGenerator:
- behavior: merge
  files:
  - application-prod.yml
  name: edge-config

images:
- name: edge-service
  newName: ghcr.io/salimsalimzade/edge-service
  newTag: 8ef0d7dcfc76e2865d0edca25fcc32b7c6add869

replicas:
- count: 1
  name: edge-service
