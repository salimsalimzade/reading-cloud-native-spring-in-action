apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

  # Remote base: order-service manifests (order-service/k8s) in this monorepo.
  # Starts at `main` like the book's 15-end; the production stage pins it to the
  # release commit (and sets the image tag) on the next order-service release.
resources:
- github.com/salimsalimzade/reading-cloud-native-spring-in-action/order-service/k8s?ref=c92c4d37e2e44b7f08d7c1bd4d8da1101351a543

# Book uses `patchesStrategicMerge`, which is deprecated in Kustomize v5.
# `patches` with a `path` is the replacement and still does a strategic merge.
patches:
- path: patch-env.yml
- path: patch-resources.yml
- path: patch-volumes.yml

# Adds application-prod.yml to the base's order-config ConfigMap.
configMapGenerator:
- behavior: merge
  files:
  - application-prod.yml
  name: order-config

images:
- name: order-service
  newName: ghcr.io/salimsalimzade/order-service
  newTag: c92c4d37e2e44b7f08d7c1bd4d8da1101351a543

replicas:
- count: 1
  name: order-service
