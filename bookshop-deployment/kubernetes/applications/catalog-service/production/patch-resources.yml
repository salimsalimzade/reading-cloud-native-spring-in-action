apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  template:
    spec:
      containers:
        - name: catalog-service
          resources:
            requests:
              memory: 756Mi   # guaranteed memory
              cpu: 0.1        # guaranteed CPU (0.1 core)
            limits:
              memory: 756Mi   # hard cap; above it the container is OOMKilled
              cpu: 2          # at most 2 cores (throttled above)
