services:
  bookshop-rabbitmq:
    image: rabbitmq:3.10-management
    container_name: bookshop-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
  bookshop-postgres:
    image: postgres:16
    container_name: bookshop-postgres
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
    volumes:
      - ./postgresql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d bookshop-catalog-db"]
      interval: 3s
      timeout: 3s
      retries: 20

  catalog-service:
    depends_on:
      bookshop-postgres:
        condition: service_healthy
    image: catalog-service:latest
    container_name: catalog-service
    ports:
      - "9001:9001"
      - "8001:8001"
    environment:
      - BPL_JVM_THREAD_COUNT=50
      - BPL_DEBUG_ENABLED=true
      - BPL_DEBUG_PORT=8001
      - SPRING_PROFILES_ACTIVE=testdata
      - SPRING_DATASOURCE_URL=jdbc:postgresql://bookshop-postgres:5432/bookshop-catalog-db
      - SPRING_CLOUD_CONFIG_ENABLED=false

  order-service:
    depends_on:
      bookshop-postgres:
        condition: service_healthy
    image: order-service:latest
    container_name: order-service
    ports:
      - "9002:9002"
      - "8002:8002"
    environment:
      - BPL_JVM_THREAD_COUNT=50
      - BPL_DEBUG_ENABLED=true
      - BPL_DEBUG_PORT=8002
      - BOOKSHOP_CATALOG_SERVICE_URI=http://catalog-service:9001
      - SPRING_R2DBC_URL=r2dbc:postgresql://bookshop-postgres:5432/bookshop-order-db
      - SPRING_FLYWAY_URL=jdbc:postgresql://bookshop-postgres:5432/bookshop-order-db

  bookshop-redis:
    image: redis:latest
    container_name: bookshop-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data: