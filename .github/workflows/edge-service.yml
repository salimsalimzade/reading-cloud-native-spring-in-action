name: Edge Service - Commit Stage
on:
  push:
    paths:
      - "edge-service/**"
      - ".github/workflows/edge-service.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  # GHCR only lets GITHUB_TOKEN push to the repo owner's namespace
  # (ghcr.io/bookshop/... failed with permission_denied), so the book's
  # "polarbookshop" maps to our GitHub account here.
  IMAGE_NAME: ${{ github.repository_owner }}/edge-service
  VERSION: ${{ github.sha }}

# Monorepo: every `run` step executes inside the service folder.
defaults:
  run:
    working-directory: edge-service

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: |
            edge-service/*.gradle*
            edge-service/**/gradle-wrapper.properties

      - name: Code vulnerability scanning
        uses: anchore/scan-action@v7
        id: scan
        with:
          path: edge-service
          fail-build: false
          severity-cutoff: high

      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: edge-service-code

      - name: Build, unit tests and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build

      # Book (Listing 14.9) uses kubeval via stefanprodan/kube-tools. kubeval is
      # unmaintained and its default schema host is offline, so we use kubeconform,
      # its drop-in successor, with the same "kustomize build | validate --strict" idea.
      - name: Validate Kubernetes manifests
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C "$RUNNER_TEMP" kubeconform
          kubectl kustomize k8s | "$RUNNER_TEMP/kubeconform" -strict -summary -

  package:
    name: Package and Publish
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle
          cache-dependency-path: |
            edge-service/*.gradle*
            edge-service/**/gradle-wrapper.properties

      - name: Build container image
        run: |
          chmod +x gradlew
          ./gradlew bootBuildImage \
            --imageName ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      - name: OCI image vulnerability scanning
        uses: anchore/scan-action@v7
        id: scan
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          fail-build: false
          severity-cutoff: high

      - name: Upload vulnerability report
        uses: github/codeql-action/upload-sarif@v4
        if: success() || failure()
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: edge-service-image

      - name: Log into container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish container image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}

      # Ch15: also tag the release candidate as `latest` so the deployment
      # manifests / local tooling can pull the newest image without a SHA.
      - name: Publish container image (latest)
        run: |
          docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
