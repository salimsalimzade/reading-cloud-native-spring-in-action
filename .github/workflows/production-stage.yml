name: Production Stage
on:
  # Listing 15.18: runs when an acceptance stage hands over a release candidate
  # (an "app_delivery" event, dispatched by the deliver job). One workflow for
  # every service: the payload says which app, image and version.
  repository_dispatch:
    types: [app_delivery]

# Production-stage runs all commit to main; run them one at a time per app.
concurrency: production-${{ github.event.client_payload.app_name }}

jobs:
  update:
    name: Update application version
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # push the updated overlay
    env:
      APP_IMAGE: ${{ github.event.client_payload.app_image }}
      APP_NAME: ${{ github.event.client_payload.app_name }}
      APP_VERSION: ${{ github.event.client_payload.app_version }}
      # Deployment config lives in this monorepo, under bookshop-deployment/.
      OVERLAY_DIR: bookshop-deployment/kubernetes/applications/${{ github.event.client_payload.app_name }}/production
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      # Order and Dispatcher deliver releases before they have a production
      # overlay; skip (with a notice) instead of failing the run.
      - name: Check production overlay exists
        id: overlay
        run: |
          if [ -f "$OVERLAY_DIR/kustomization.yml" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No production overlay at $OVERLAY_DIR yet; skipping $APP_NAME $APP_VERSION."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install kustomize
        if: steps.overlay.outputs.exists == 'true'
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.3/kustomize_v5.8.3_linux_amd64.tar.gz \
            | tar xz -C "$RUNNER_TEMP" kustomize
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Update image version
        if: steps.overlay.outputs.exists == 'true'
        working-directory: ${{ env.OVERLAY_DIR }}
        run: |
          # The version becomes part of a sed expression below; accept only a
          # commit SHA so it can't inject sed syntax.
          [[ "$APP_VERSION" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid version: $APP_VERSION"; exit 1; }
          kustomize edit set image "$APP_NAME=$APP_IMAGE:$APP_VERSION"
          # Pin the remote base (?ref=...) to the same release commit. The
          # book's `s/ref=[\w+]/.../` replaces only one character and drops
          # "ref=", so replace the whole ref value (a SHA, or "main" initially).
          sed -i -E "s/(\?ref=)[^[:space:]\"']+/\1$APP_VERSION/" kustomization.yml
          git diff --stat

      # Book uses stefanzweifel/git-auto-commit-action; plain git avoids handing
      # the token to a third-party action. A push made with GITHUB_TOKEN doesn't
      # trigger other workflows, so this can't start a pipeline loop.
      - name: Commit updated manifests
        if: steps.overlay.outputs.exists == 'true'
        run: |
          if git diff --quiet; then
            echo "Overlay already at $APP_VERSION, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OVERLAY_DIR/kustomization.yml"
          git commit -m "Update $APP_NAME to version $APP_VERSION"
          # main may have moved since checkout (e.g. another service's release).
          git pull --rebase origin main
          git push origin HEAD:main
